{% extends "base.html" %}

{% block title %}
Register - PageTurner Books
{% endblock %}

{% block content %}

<div class="container">

    <div class="auth-container card">

        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <div class="page-header">

            <h1>
                Create Account
            </h1>

            <p>
                Create your PageTurner Books account.
            </p>

        </div>


        <!-- =================================================
             REGISTER FORM
        ================================================== -->

        <form
            method="POST"
            action="{{ url_for('shop.register') }}"
        >

            <!-- STEP 33: CSRF TOKEN -->

            <input
                type="hidden"
                name="_csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    value="{{ request.form.get('name', '') }}"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    value="{{ request.form.get('email', '') }}"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <small>
                    Password must contain at least
                    8 characters.
                </small>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Enter the password again"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn btn-primary btn-full"
            >
                Create Account
            </button>

        </form>


        <!-- =================================================
             LOGIN LINK
        ================================================== -->

        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login here
            </a>

        </p>

    </div>

</div>

{% endblock %}
