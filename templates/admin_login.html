{% extends "base.html" %}

{% block title %}
Admin Login | PageTurner Books
{% endblock %}


{% block content %}

<section class="admin-login-section">

    <div class="login-card">

        <div class="admin-lock">
            🔐
        </div>

        <span class="section-label">
            ADMINISTRATION
        </span>

        <h1>
            Admin Login
        </h1>

        <p>
            Sign in to manage books, stock and reports.
        </p>


        <form method="POST">

            <label>
                Admin Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
                autofocus
            >

            <button
                type="submit"
                class="primary-button full-button"
            >
                Sign In
            </button>

        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-link"
        >
            ← Back to store
        </a>

    </div>

</section>

{% endblock %}
