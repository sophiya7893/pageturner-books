{% extends "base.html" %}

{% block title %}
Change Password - PageTurner Books
{% endblock %}


{% block content %}

<section class="account-form-page">

    <div class="account-form-card">

        <div class="page-header">

            <span class="page-eyebrow">
                SECURITY
            </span>

            <h1>
                Change Password
            </h1>

            <p>
                Enter your current password before
                choosing a new password.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('auth.change_password') }}"
            class="account-form"
        >

            <!-- ============================================
                 CSRF
            ============================================= -->

            <input
                type="hidden"
                name="_csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- ============================================
                 CURRENT PASSWORD
            ============================================= -->

            <div class="form-group">

                <label for="current_password">
                    Current Password
                </label>

                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- ============================================
                 NEW PASSWORD
            ============================================= -->

            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <small>
                    Minimum 8 characters.
                </small>

            </div>


            <!-- ============================================
                 CONFIRM PASSWORD
            ============================================= -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- ============================================
                 BUTTONS
            ============================================= -->

            <div class="form-actions">

                <button
                    type="submit"
                    class="shop-btn shop-btn-primary"
                >
                    Change Password
                </button>

                <a
                    href="{{ url_for('shop.profile') }}"
                    class="shop-btn shop-btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
