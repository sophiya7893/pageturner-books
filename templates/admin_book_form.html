{% extends "base.html" %}

{% block title %}
{{ action }} | PageTurner Books
{% endblock %}


{% block content %}

<section class="admin-section">

    <div class="admin-container narrow">

        <div class="admin-header">

            <div>

                <span class="section-label">
                    BOOK MANAGEMENT
                </span>

                <h1>
                    {{ action }}
                </h1>

            </div>

            <a
                href="{{ url_for('admin_page') }}"
                class="secondary-button"
            >
                ← Back
            </a>

        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
            class="book-form"
        >

            <div class="form-grid">

                <div class="form-group full">

                    <label>
                        Book Title *
                    </label>

                    <input
                        type="text"
                        name="title"
                        value="{{ book['title'] if book else '' }}"
                        placeholder="Enter book title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Author *
                    </label>

                    <input
                        type="text"
                        name="author"
                        value="{{ book['author'] if book else '' }}"
                        placeholder="Author name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category *
                    </label>

                    <input
                        type="text"
                        name="category"
                        value="{{ book['category'] if book else '' }}"
                        placeholder="e.g. Fiction"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Price *
                    </label>

                    <input
                        type="number"
                        name="price"
                        step="0.01"
                        min="0"
                        value="{{ book['price'] if book else '' }}"
                        placeholder="499"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Stock *
                    </label>

                    <input
                        type="number"
                        name="stock"
                        min="0"
                        value="{{ book['stock'] if book else '0' }}"
                        placeholder="10"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Description
                    </label>

                    <textarea
                        name="description"
                        rows="6"
                        placeholder="Write a short description..."
                    >{{ book['description'] if book else '' }}</textarea>

                </div>


                <div class="form-group">

                    <label>
                        Cover Background
                    </label>

                    <input
                        type="color"
                        name="cover_color"
                        value="{{ book['cover_color'] if book else '#172033' }}"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Book Cover Photo
                    </label>

                    <input
                        type="file"
                        name="cover_image"
                        accept=".jpg,.jpeg,.png,.webp"
                    >

                    <small class="form-help">
                        JPG, JPEG, PNG or WEBP. Maximum 5 MB.
                    </small>

                </div>

            </div>


            {% if book and book['cover_image'] %}

                <div class="current-cover">

                    <span>
                        Current Cover
                    </span>

                    <img
                        src="{{ url_for(
                            'static',
                            filename='images/books/' + book['cover_image']
                        ) }}"
                        alt="{{ book['title'] }}"
                    >

                </div>

            {% endif %}


            <div class="form-actions">

                <a
                    href="{{ url_for('admin_page') }}"
                    class="secondary-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-button"
                >
                    {{ action }}
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
