{% extends "base.html" %}

{% block title %}Login - PageTurner Books{% endblock %}

{% block content %}

<div class="container">

    <div class="auth-container">

        <div class="card auth-card">

            <div class="page-header">
                <h1>Login</h1>
                <p>Sign in to your PageTurner Books account.</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        value="{{ request.form.get('email', '') }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="{{ url_for('register') }}">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
