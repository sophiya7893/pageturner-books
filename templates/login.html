{% extends "base.html" %}

{% block title %}
Login - PageTurner Books
{% endblock %}

{% block content %}

<div class="container">

    <div class="auth-container">

        <div class="card auth-card">

            <!-- =================================================
                 PAGE HEADER
            ================================================== -->

            <div class="page-header">

                <h1>
                    Login
                </h1>

                <p>
                    Sign in to your PageTurner Books account.
                </p>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                method="POST"
                action="{{ url_for('auth.login') }}"
            >

                <!-- STEP 33: CSRF TOKEN -->

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        value="{{ request.form.get('email', '') }}"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Login
                </button>

            </form>


            <!-- =================================================
                 AUTH LINKS
            ================================================== -->

            <div class="auth-footer">

                <p>
                    Don't have an account?

                    <a href="{{ url_for('shop.register') }}">
                        Create an account
                    </a>
                </p>


                <p>

                    <a
                        href="{{ url_for(
                            'auth.forgot_password'
                        ) }}"
                    >
                        Forgot your password?
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
